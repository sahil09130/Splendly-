<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Spendly{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .footer-links {
            display: flex;
            align-items: center;
            color: var(--accent-5);
            gap: 0.6rem;
            margin-top: 0.4rem;
            font-size: 0.8rem;
        }
        .footer-links a {
            color: var(--ink-faint);
            transition: color 0.2s;
        }
        .footer-links a:hover {
            color: var(--paper);
        }
        .footer-links a:focus-visible {
            outline: 2px solid var(--accent-2);
            outline-offset: 2px;
            border-radius: 2px;
        }
        .footer-links-sep {
            color: var(--ink-faint);
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>

    <nav class="navbar">
        <div class="nav-inner">
            <a href="{{ url_for('landing') }}" class="nav-brand">
                <span class="brand-icon">◈</span>
                <span class="brand-name">Spendly</span>
            </a>
            <div class="nav-links">
                <a href="{{ url_for('login') }}">Sign in</a>
                <a href="{{ url_for('register') }}" class="nav-cta">Get started</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <span class="brand-icon">◈</span>
            <span class="footer-name">Spendly</span>
            <p class="footer-copy">Track every rupee. Own your finances.</p>
            <nav class="footer-links" aria-label="Legal">
                <a href="/privacy-policy">Privacy Policy</a>
                <span class="footer-links-sep" aria-hidden="true">|</span>
                <a href="/terms-and-conditions">Terms &amp; Conditions</a>
            </nav>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
